<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">

<head>


<meta charset="UTF-8">

<title>Lista de Eventos</title>

<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">


</head>

<body>


<div th:replace="~{menu :: menu}"></div>

<div class="container">

    <h3>Eventos cadastrados</h3>

    <table class="highlight">

        <thead>

            <tr>

                <th>ID</th>
                <th>Nome</th>
                <th>Local</th>
                <th>Data</th>
                <th>Horário</th>
                <th>Ações</th>

            </tr>

        </thead>

        <tbody>

            <tr th:each="evento : ${eventos}">

                <td th:text="${evento.id}"></td>

                <td>

                    <a th:href="@{/eventos/{id}(id=${evento.id})}"
                       th:text="${evento.nome}">

                    </a>

                </td>

                <td th:text="${evento.local}"></td>

                <td th:text="${evento.data}"></td>

                <td th:text="${evento.horario}"></td>

                <td>

                    <a class="btn blue"
                       th:href="@{/eventos/editar/{id}(id=${evento.id})}">

                        Editar

                    </a>

                    <a class="btn red"
                       th:href="@{/eventos/excluir/{id}(id=${evento.id})}">

                        Excluir

                    </a>

                </td>

            </tr>

        </tbody>

    </table>

</div>


</body>

</html>
