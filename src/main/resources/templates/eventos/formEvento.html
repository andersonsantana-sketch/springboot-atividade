<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Cadastrar Evento</title>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
</head>

<body>

    <div th:replace="~{menu :: menu}"></div>

    <div class="container">

        <h3 th:text="${evento.id == null ? 'Cadastrar Evento' : 'Editar Evento'}">
            Cadastrar Evento
        </h3>

        <form action="/eventos/salvar" method="post">

            <input type="hidden" name="id" th:value="${evento.id}">

            <div class="input-field">
                <input type="text"
                       id="nome"
                       name="nome"
                       th:value="${evento.nome}"
                       required>
                <label for="nome">Nome</label>
            </div>

            <div class="input-field">
                <input type="text"
                       id="local"
                       name="local"
                       th:value="${evento.local}"
                       required>
                <label for="local">Local</label>
            </div>

            <div class="input-field">
                <input type="text"
                       id="data"
                       name="data"
                       th:value="${evento.data}"
                       required>
                <label for="data">Data</label>
            </div>

            <div class="input-field">
                <input type="text"
                       id="horario"
                       name="horario"
                       th:value="${evento.horario}"
                       required>
                <label for="horario">Horário</label>
            </div>

            <button class="btn waves-effect waves-light" type="submit">
                Salvar
            </button>

            <button class="btn waves-effect waves-light" type="reset">
                Limpar
            </button>

        </form>

    </div>

</body>
</html>
