<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">

<head>


<meta charset="UTF-8">

<title>Detalhes do Evento</title>

<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">


</head>

<body>


<div th:replace="~{menu :: menu}"></div>

<div class="container">

    <h3>Detalhes do Evento</h3>

    <div class="card">

        <div class="card-content">

            <span class="card-title"
                  th:text="${evento.nome}">

                Nome do evento

            </span>

            <p>
                <strong>ID:</strong>
                <span th:text="${evento.id}"></span>
            </p>

            <p>
                <strong>Local:</strong>
                <span th:text="${evento.local}"></span>
            </p>

            <p>
                <strong>Data:</strong>
                <span th:text="${evento.data}"></span>
            </p>

            <p>
                <strong>Horário:</strong>
                <span th:text="${evento.horario}"></span>
            </p>

        </div>

        <div class="card-action">

            <a th:href="@{/eventos}">
                Voltar para eventos
            </a>

        </div>

    </div>

    <h4>Convidados</h4>

    <table class="highlight">

        <thead>

            <tr>

                <th>ID</th>
                <th>Nome</th>
                <th>RG</th>
                <th>Ações</th>

            </tr>

        </thead>

        <tbody>

            <tr th:each="convidado : ${convidados}">

                <td th:text="${convidado.id}"></td>

                <td th:text="${convidado.nome}"></td>

                <td th:text="${convidado.rg}"></td>

                <td>

                    <a class="btn blue"
                       th:href="@{/convidados/editar/{id}(id=${convidado.id})}">

                        Editar

                    </a>

                    <a class="btn red"
                       th:href="@{/convidados/remover/{id}(id=${convidado.id})}">

                        Remover

                    </a>

                </td>

            </tr>

        </tbody>

    </table>

</div>


</body>

</html>
