<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">

<head>


<meta charset="UTF-8">

<title>Editar Convidado</title>

<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">


</head>

<body>


<div th:replace="~{menu :: menu}"></div>

<div class="container">

    <h3>Editar Convidado</h3>

    <form action="/convidados/salvar" method="post">

        <input type="hidden"
               name="id"
               th:value="${convidado.id}">

        <div class="input-field">

            <input type="text"
                   id="nome"
                   name="nome"
                   th:value="${convidado.nome}"
                   required>

            <label for="nome">Nome</label>

        </div>

        <div class="input-field">

            <input type="text"
                   id="rg"
                   name="rg"
                   th:value="${convidado.rg}"
                   required>

            <label for="rg">RG</label>

        </div>

        <input type="hidden"
               name="evento.id"
               th:value="${convidado.evento.id}">

        <button class="btn waves-effect waves-light" type="submit">
            Salvar
        </button>

    </form>

</div>


</body>

</html>
