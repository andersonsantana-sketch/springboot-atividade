<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Editar Convidado</title>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
</head>

<body>

    <div th:replace="~{menu :: menu}"></div>

    <div class="container">

        <h3>Editar Convidado</h3>

        <form th:object="${convidado}"
              action="/convidados/salvar"
              method="post">

            <input type="hidden"
                   th:field="*{id}">

            <div class="input-field">

                <input type="text"
                       id="nome"
                       th:field="*{nome}">

                <label for="nome">Nome</label>

                <span class="red-text"
                      th:if="${#fields.hasErrors('nome')}"
                      th:errors="*{nome}">
                </span>

            </div>

            <div class="input-field">

                <input type="text"
                       id="rg"
                       th:field="*{rg}">

                <label for="rg">RG</label>

                <span class="red-text"
                      th:if="${#fields.hasErrors('rg')}"
                      th:errors="*{rg}">
                </span>

            </div>

            <input type="hidden"
                   name="evento.id"
                   th:value="${convidado.evento.id}">

            <button class="btn waves-effect waves-light"
                    type="submit">
                Salvar
            </button>

        </form>

    </div>

</body>

</html>
